<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pulpit{% endblock %} — Heiko Predictive Control</title>
<link rel="stylesheet" href="{{ base }}/static/uplot.min.css?v={{ version }}">
<link rel="stylesheet" href="{{ base }}/static/app.css?v={{ version }}">
<meta name="theme-color" content="#faf9f7">
</head>
<body>
<nav class="nav">
  <span class="nav-brand">Heiko Predictive Control</span>
  <div class="nav-links">
    <a href="{{ base }}/" {% if active == 'dashboard' %}class="active"{% endif %}>Pulpit</a>
    <a href="{{ base }}/advisor" {% if active == 'advisor' %}class="active"{% endif %}>Doradca</a>
    <a href="{{ base }}/tests" {% if active == 'tests' %}class="active"{% endif %}>Testy</a>
    <a href="{{ base }}/statistics" {% if active == 'statistics' %}class="active"{% endif %}>Statystyki</a>
    <a href="{{ base }}/report" {% if active == 'report' %}class="active"{% endif %}>Raport</a>
    <a href="{{ base }}/options" {% if active == 'options' %}class="active"{% endif %}>Opcje</a>
  </div>
  {% if tariff_source == 'fallback' %}<span class="badge kind-eksperyment" id="tariff-fallback" title="Harmonogram taryfy z pv_roi jest niedostępny lub starszy niż 3 h">taryfa: zapas G12w — brak danych z pv_roi</span>{% endif %}
  <span class="nav-version">v{{ version }}</span>
</nav>
<main class="main">
{% block content %}{% endblock %}
</main>
<script>window.APP_BASE = {{ base|tojson }};</script>
<script src="{{ base }}/static/app.js?v={{ version }}"></script>
<script src="{{ base }}/static/uplot.min.js?v={{ version }}"></script>
<script src="{{ base }}/static/glossary.js?v={{ version }}"></script>
<script src="{{ base }}/static/ui.js?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
