name: Heiko Predictive Control
version: "0.7.2"
slug: heiko_predictive_control
description: >-
  Predykcyjne sterowanie pompą ciepła Heiko (podłogówka) i klimatyzacją
  poddasza pod taryfę G12w. Pętla B (AC poddasza) steruje klimatyzacją w oknie
  pracy; pętla A (Heiko) jest na razie tylko odczytem (dry-run kosztu/oszczędności).
url: "https://github.com/miczu71/heiko-predictive-control"
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
services:
  - mqtt:need
# Układ domu (pokoje, meble, urządzenia) jest prywatny — czytany z konfiguracji
# HA, nie z tego publicznego repo. Tylko odczyt.
map:
  - homeassistant_config:ro
ingress: true
ingress_port: 8101
panel_icon: mdi:radiator
options:
  # Układ domu na pulpicie — plik JSON w konfiguracji HA (brak = przykładowy dom)
  house_layout_file: "/homeassistant/heiko_predictive/house.json"
  # Pętla A — Heiko (podłogówka)
  day_zone_temp_entities: "sensor.salon_temperature,sensor.kuchnia_temperature,sensor.sypialnia_temperature,sensor.pokoj_1_temperature,sensor.pokoj_2_temperature"
  outdoor_temp_entity: "sensor.heiko_heat_pump_ambient_air_temperature"
  weather_entity: "weather.forecast_home"
  solcast_remaining_today_entity: "sensor.solcast_pv_forecast_forecast_remaining_today"
  tariff_state_entity: "sensor.power_tauron_g12w_current_tariff"
  tariff_price_entity: "sensor.power_tauron_g12w_current_price"
  pump_energy_entity: "sensor.energia_pompa_ciepla_energy"
  heiko_setpoint_entity: "number.heiko_heat_pump_heating_setpoint"
  heiko_curve_switch_entity: "switch.heiko_heat_pump_heating_curve"
  # Punkty krzywej grzewczej (5 par temp. zewn. -> woda) i sensory pompy do uczenia modelu
  heiko_curve_ambient_entities: "number.heiko_heat_pump_curve_ambient_temp_1,number.heiko_heat_pump_curve_ambient_temp_2,number.heiko_heat_pump_curve_ambient_temp_3,number.heiko_heat_pump_curve_ambient_temp_4,number.heiko_heat_pump_curve_ambient_temp_5"
  heiko_curve_water_entities: "number.heiko_heat_pump_curve_water_temp_1,number.heiko_heat_pump_curve_water_temp_2,number.heiko_heat_pump_curve_water_temp_3,number.heiko_heat_pump_curve_water_temp_4,number.heiko_heat_pump_curve_water_temp_5"
  heiko_water_temp_entity: "sensor.heiko_heat_pump_condenser_temperature"
  heiko_working_mode_entity: "sensor.heiko_heat_pump_working_mode_2"
  # Aktualny cel wody wg pompy (krzywa + przesunięcie + natywna ograniczona nastawa) i przesunięcie krzywej
  heiko_water_setpoint_entity: "sensor.heiko_heat_pump_water_temperature_setpoint"
  heiko_curve_shift_entity: "number.heiko_heat_pump_heating_curve_parallel_shift"
  # Czujnik temp. zewn. z długą historią LTS (bootstrap modelu z zeszłej zimy); pusty = outdoor_temp_entity
  heiko_bootstrap_outdoor_entity: "sensor.openweathermap_temperature"
  # Środek pasma komfortu pokoi, minimum pojedynczego pokoju (bezpiecznik), granice nastawy wody
  heiko_room_target_c: 20.6
  heiko_room_min_c: 18.5
  heiko_water_min_c: 20.0
  heiko_water_max_c: 32.0
  heiko_comfort_band_day_c: 1.0
  heiko_comfort_band_night_c: 1.5
  heiko_economy_band_day_c: 1.5
  heiko_economy_band_night_c: 2.0
  heiko_day_start_hour: 6
  heiko_day_end_hour: 22
  heiko_write_throttle_min: 15
  heiko_enabled: false
  heiko_active_profile: "ekonomia"
  # Pętla B — AC poddasze
  attic_ac_entity: "climate.poddasze"
  attic_temp_entity: "sensor.poddasze_temperature"
  attic_door_entity: ""
  attic_power_entity: ""
  # Okna poddasza (lista po przecinku) — otwarte >2 min = pauza grzania; brak = bez pauzy
  attic_window_entities: ""
  # Encja „urlop” (binary_sensor, on = urlop, AC nie startuje); brak = ignorowane
  attic_vacation_entity: ""
  # Ręczny przełącznik pauzy (input_boolean/switch, on = AC nie grzeje); brak = ignorowane
  attic_pause_entity: ""
  # Czujnik obecności (binary_sensor, on = ktoś jest); brak = reguła „pusto" wyłączona
  attic_presence_entity: ""
  attic_work_start_hour: 8
  attic_work_end_hour: 16
  attic_comfort_target_c: 22.0
  attic_economy_target_c: 20.5
  attic_preheat_lead_min: 45
  attic_preheat_max_min: 120
  attic_cycle_interval_min: 5
  # Ile minut pustki w oknie pracy wyłącza AC (liczone od początku okna); 0 = wyłączone
  attic_vacant_after_min: 60
  attic_enabled: false
  attic_active_profile: "ekonomia"
  # Wspólne
  cycle_interval_min: 15
  notify_service: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
  timezone: "Europe/Warsaw"
schema:
  house_layout_file: str?
  day_zone_temp_entities: str
  outdoor_temp_entity: str
  weather_entity: str?
  solcast_remaining_today_entity: str?
  tariff_state_entity: str
  tariff_price_entity: str?
  pump_energy_entity: str
  heiko_setpoint_entity: str
  heiko_curve_switch_entity: str
  heiko_curve_ambient_entities: str?
  heiko_curve_water_entities: str?
  heiko_water_temp_entity: str?
  heiko_working_mode_entity: str?
  heiko_water_setpoint_entity: str?
  heiko_curve_shift_entity: str?
  heiko_bootstrap_outdoor_entity: str?
  heiko_room_target_c: float
  heiko_room_min_c: float
  heiko_water_min_c: float
  heiko_water_max_c: float
  heiko_comfort_band_day_c: float
  heiko_comfort_band_night_c: float
  heiko_economy_band_day_c: float
  heiko_economy_band_night_c: float
  heiko_day_start_hour: int
  heiko_day_end_hour: int
  heiko_write_throttle_min: int
  heiko_enabled: bool
  heiko_active_profile: "list(komfort|ekonomia)"
  attic_ac_entity: str
  attic_temp_entity: str
  attic_door_entity: str?
  attic_power_entity: str?
  attic_window_entities: str?
  attic_vacation_entity: str?
  attic_pause_entity: str?
  attic_presence_entity: str?
  attic_work_start_hour: int
  attic_work_end_hour: int
  attic_comfort_target_c: float
  attic_economy_target_c: float
  attic_preheat_lead_min: int
  attic_preheat_max_min: int
  attic_cycle_interval_min: int
  attic_vacant_after_min: int
  attic_enabled: bool
  attic_active_profile: "list(komfort|ekonomia)"
  cycle_interval_min: int
  notify_service: str?
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
  log_level: "list(debug|info|warning|error)?"
  timezone: str?
